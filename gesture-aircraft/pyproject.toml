[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-gesture-control"
version = "0.1.0"
description = "PC webcam prototype for gesture-driven drone motion commands"
requires-python = ">=3.10"
dependencies = [
    "mediapipe>=0.10.20,<0.11",
    "numpy>=2.0,<3",
    "opencv-python>=4.10,<5",
]

[tool.setuptools]
packages = ["drone_gesture"]
